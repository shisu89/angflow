name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @angflow/system
        run: pnpm --filter @angflow/system run build

      - name: Build @angflow/angular
        run: pnpm --filter @angflow/angular run build

      - name: Build @angflow/mcp
        run: pnpm --filter @angflow/mcp run build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test @angflow/system
        run: pnpm --filter @angflow/system run test

      - name: Test @angflow/angular
        run: pnpm --filter @angflow/angular run test

      - name: Test @angflow/mcp
        run: pnpm --filter @angflow/mcp run test

  e2e-angular:
    name: Upstream e2e suite (Angular, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @angflow/system
        run: pnpm --filter @angflow/system run build

      - name: Build @angflow/angular
        run: pnpm --filter @angflow/angular run build

      - name: Drift check (upstream generic-test configs)
        run: pnpm --filter angular-examples run check:generic-tests

      - name: Playwright version
        id: pw
        working-directory: tests/playwright
        run: echo "v=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}

      - name: Install Chromium
        working-directory: tests/playwright
        run: pnpm exec playwright install --with-deps chromium

      # Playwright's exit code is not the verdict: known-failure tests fail by design.
      # test:angular runs chromium + ng-known-failures (one server start) and then
      # check-known-failures.mjs, whose exit code is the script's: it fails closed on a
      # missing/errored report or a run where nothing executed.
      - name: Run suite and verdict
        working-directory: tests/playwright
        env:
          CI: 'true'
        run: |
          set +e
          echo '### Upstream e2e suite (Angular)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm run test:angular 2>&1 | tee "$RUNNER_TEMP/e2e-run.log"
          status=${PIPESTATUS[0]}
          sed -n '/^known failures:/,$p' "$RUNNER_TEMP/e2e-run.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-angular
          path: |
            tests/playwright/playwright-report
            tests/playwright/test-results
          retention-days: 7
